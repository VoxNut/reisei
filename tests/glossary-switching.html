<!doctype html>
<meta charset="utf-8">
<title>Glossary switching regression</title>
<link rel="stylesheet" href="../style.css">
<body class="card nightMode">
<output id="result">Running…</output>
<div class="back" id="fixture"></div>
<script>
  // Serve the repository over HTTP and open tests/glossary-switching.html.
  (async () => {
    try {
      const response = await fetch("../_senren_back_v4.7.0.js");
      if (!response.ok) throw new Error("Cannot load the back script");
      const source = await response.text();
      const start = source.indexOf("  function toggleDefinition() {");
      const end = source.indexOf("  function enableInteractions() {", start);
      if (start < 0 || end < 0) throw new Error("Cannot locate toggleDefinition");
      const buildToggle = new Function("ELS", "collapseDictionary", "lightbox",
        source.slice(start, end) + "\nreturn toggleDefinition;");
      const consolidateStart = source.indexOf("  function consolidateYomitanGlossaryEntries() {");
      const consolidateEnd = source.indexOf("  // Collapses long dictionary entries", consolidateStart);
      if (consolidateStart < 0 || consolidateEnd < 0) throw new Error("Cannot locate glossary consolidation");
      const buildConsolidate = new Function("ELS",
        source.slice(consolidateStart, consolidateEnd) + "\nreturn consolidateYomitanGlossaryEntries;");
      const entry = (name, text) => `<li data-dictionary="${name}">${text}</li>`;
      const a = entry("A", "First dictionary<ul><li>A nested definition</li></ul>");
      const b = entry("B", "Second dictionary");
      const c = entry("C", "Third dictionary");
      const cases = [
        ["standard export", `<div class="yomitan-glossary"><ol>${a}${b}${c}</ol></div>`],
        ["split export (ぐっすり)", `<div class="yomitan-glossary"><ol>${a}</ol></div>${b}${c}`],
        ["list without a wrapper", `<ol>${a}${b}${c}</ol>`],
        ["extra wrapper", `<section><div class="yomitan-glossary"><ol>${a}${b}${c}</ol></div></section>`],
        ["detached definition list (ぐっすり)", `<div class="yomitan-glossary"><ol>${a}${b}<li data-owner="B">B_EXTRA_TEXT<ul><li>B_NESTED_TEXT</li></ul></li><li data-owner="B">B_SECOND_EXTRA_TEXT</li></ol></div>${c}`],
      ];
      const saved = ["lastSelectedDictionary", "lastDictionaryName"]
        .map(key => [key, localStorage.getItem(key)]);
      let checks = 0;
      try {
        for (const theme of ["nord", "focus"]) {
          document.documentElement.dataset.senrenTheme = theme;
          document.documentElement.classList.toggle("custom-dark-mode", theme === "focus");
          for (const [name, html] of cases) {
            fixture.innerHTML = `<div id="glossary" class="yomitan-glossary"><div class="dictionary-counter"></div><div class="toggle-area left"></div><div class="toggle-area right"></div><div class="glossary-box"><span></span></div></div>`;
            const glossary = fixture.querySelector("#glossary");
            glossary.querySelector(".glossary-box > span").innerHTML = html;
            localStorage.setItem("lastSelectedDictionary", "glossary");
            localStorage.setItem("lastDictionaryName", "B");
            const consolidate = buildConsolidate({ glossary });
            consolidate();
            consolidate();
            buildToggle({ glossary }, () => {}, null)();
            for (const [expected, direction] of [
              ["B", "right"], ["C", "right"], ["A", "right"],
              ["B", "left"], ["A", "left"], ["C", "right"],
            ]) {
              const visible = [...glossary.querySelectorAll("li[data-dictionary]")]
                .filter(li => getComputedStyle(li).display !== "none");
              if (visible.length !== 1 || visible[0].dataset.dictionary !== expected) {
                throw new Error(`${theme}, ${name}: expected only ${expected}, got ${visible.map(li => li.dataset.dictionary)}`);
              }
              for (const extra of glossary.querySelectorAll("[data-owner]")) {
                if (extra.closest("li[data-dictionary]")?.dataset.dictionary !== extra.dataset.owner) {
                  throw new Error(`${theme}, ${name}: detached definition lost its dictionary`);
                }
                const textVisible = glossary.innerText.includes(extra.firstChild.textContent);
                if (textVisible !== (extra.dataset.owner === expected)) {
                  throw new Error(`${theme}, ${name}: stray definition text when displaying ${expected}`);
                }
              }
              const index = ["A", "B", "C"].indexOf(expected) + 1;
              if (glossary.querySelector(".dictionary-counter").textContent !== `${index} / 3`) {
                throw new Error(`${theme}, ${name}: incorrect dictionary counter`);
              }
              checks++;
              glossary.querySelector(`.toggle-area.${direction}`).click();
            }
          }
          const emptyExport = '<style>@import url("missing-test-stylesheet.css");</style><div class="yomitan-glossary"><ol></ol></div>';
          for (const test of [
            {name:"stylesheet-only definition (やがて)", definition:emptyExport, order:["A","B","C"]},
            {name:"empty wrappers and script", definition:'<div><br>\u200b</div><script>not a definition</'+'script>', order:["A","B","C"]},
            {name:"empty selection", selection:emptyExport, order:["A","B","C"]},
            {name:"empty glossary entry", extra:entry("EMPTY", emptyExport+'<div class="dictionary-title">EMPTY</div>'), order:["A","B","C"]},
            {name:"text definition", definition:"Valid definition", order:["definition","A","B","C"]},
            {name:"image definition", definition:'<img src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22/%3E">', order:["definition","A","B","C"]},
            {name:"definition duplicate", definition:entry("A","Valid definition"), order:["definition","B","C"]},
            {name:"text selection", selection:"Selected text", order:["selectionText","A","B","C"]},
          ]) {
            const panel=(id,box,html)=>`<div id="${id}" class="yomitan-glossary"><div class="dictionary-counter"></div><div class="toggle-area left"></div><div class="toggle-area right"></div><div class="${box}"><span>${html||""}</span></div></div>`;
            fixture.innerHTML=panel("selectionText","selection-box",test.selection)+panel("definition","definition-box",test.definition)+panel("glossary","glossary-box",`<div class="yomitan-glossary"><ol>${a}${b}${c}${test.extra||""}</ol></div>`);
            const els=Object.fromEntries(["selectionText","definition","glossary"].map(id=>[id,fixture.querySelector(`#${id}`)]));
            localStorage.setItem("lastSelectedDictionary","glossary");
            localStorage.setItem("lastDictionaryName","B");
            const toggle=buildToggle(els,()=>{},document.createElement("div"));
            toggle();toggle(); // Existing counters must not make an empty panel count as content.
            let index=test.selection==="Selected text"?0:test.order.indexOf("B");
            for(let step=0;step<test.order.length*3;step++){
              const expected=test.order[index];
              const active=[...fixture.querySelectorAll("#selectionText.show,#definition.show,#glossary.show")];
              const shown=active[0];
              const actual=shown?.id==="glossary"?[...shown.querySelectorAll('li[data-dictionary]')].find(li=>li.style.display==="block")?.dataset.dictionary:shown?.id;
              if(active.length!==1||actual!==expected||!shown.innerText.trim())throw Error(`${theme}, ${test.name}: expected ${expected}, got ${actual}`);
              if(shown.querySelector('.dictionary-counter').textContent!==`${index+1} / ${test.order.length}`)throw Error(`${theme}, ${test.name}: incorrect counter`);
              checks++;
              const right=step%3!==2;
              if(step%2)document.dispatchEvent(new KeyboardEvent("keydown",{key:right?"k":"j",bubbles:true}));
              else shown.querySelector(`.toggle-area.${right?"right":"left"}`).click();
              index=(index+(right?1:-1)+test.order.length)%test.order.length;
            }
          }
          const preferredName="三省堂国語辞典　第八版";
          const showCard=(preference="",definition="",selection="",extra="")=>{
            fixture.innerHTML=`<div id="dictionaryPreference" hidden></div><div id="selectionText"><div class="dictionary-counter"></div><div class="toggle-area right"></div><span>${selection}</span></div><div id="definition"><div class="dictionary-counter"></div><div class="toggle-area right"></div><div class="definition-box">${definition}</div></div><div id="glossary" class="yomitan-glossary"><div class="dictionary-counter"></div><div class="toggle-area right"></div><div class="glossary-box"><span><ol>${a}${extra}${entry(preferredName,"Preferred definition")}${b}</ol></span></div></div>`;
            fixture.querySelector('#dictionaryPreference').textContent=preference;
            const els=Object.fromEntries(["selectionText","definition","glossary"].map(id=>[id,fixture.querySelector(`#${id}`)]));
            buildToggle(els,()=>{},document.createElement('div'))();
          };
          const assertActive=(expected,label)=>{
            const active=fixture.querySelector('#selectionText.show,#definition.show,#glossary.show');
            const actual=active?.id==='glossary'?[...active.querySelectorAll('li[data-dictionary]')].find(li=>li.style.display==='block')?.dataset.dictionary:active?.id;
            if(actual!==expected)throw Error(`${theme}, ${label}: expected ${expected}, got ${actual}`);
            checks++;
          };
          localStorage.removeItem('lastSelectedDictionary');localStorage.removeItem('lastDictionaryName');
          showCard();assertActive('A','first card default');
          fixture.querySelector('#glossary .toggle-area.right').click();
          fixture.querySelector('#glossary .toggle-area.right').click();
          assertActive('B','manual choice on first card');
          showCard(preferredName);assertActive(preferredName,'next card preference overrides remembered B');
          fixture.querySelector('#glossary .toggle-area.right').click();assertActive('B','manual switching still works on preferred card');
          showCard('A');assertActive('A','next card uses its own preference');
          showCard();assertActive('B','no preference keeps remembered choice');
          showCard('Unavailable dictionary');assertActive('B','unavailable preference keeps remembered choice');
          showCard('glossary');assertActive('A','generic glossary preference overrides remembered choice');
          showCard('三省堂');assertActive(preferredName,'partial dictionary preference');
          showCard(preferredName,entry(preferredName,'Preferred dictionary in Definition'));assertActive('definition','preferred dictionary in Definition');
          showCard(preferredName,entry(preferredName,'Preferred dictionary in Definition'),'Selected passage');assertActive('selectionText','selection text priority retained');
          showCard('B','','',entry('B extended','Another edition'));assertActive('B','exact dictionary match preferred');
          localStorage.setItem('lastDictionaryName','Missing previous dictionary');
          showCard(preferredName);assertActive(preferredName,'missing remembered dictionary does not override preference');
          const orderedNames=[preferredName,"新明解国語辞典　第八版","広辞苑 第七版","大辞林　第四版","デジタル大辞泉","実用日本語表現辞典v2","Pixiv Light [2026-10-03]","使い方の分かる 類語例解辞典","Jitendex.org [2026-10-03]","新和英大辞典 第5版","daijirin4-gpt-6-luna en-jp"];
          for(const definitionName of ["Jitendex.org [2026-03-05]",orderedNames[8]]){
            fixture.innerHTML=`<div id="dictionaryPreference" hidden>${preferredName}</div><div id="definition"><div class="dictionary-counter"></div><div class="toggle-area left"></div><div class="toggle-area right"></div><div class="definition-box"><ol>${entry(definitionName,"Definition copy")}</ol></div></div><div id="glossary" class="yomitan-glossary"><div class="dictionary-counter"></div><div class="toggle-area left"></div><div class="toggle-area right"></div><div class="glossary-box"><span><ol>${orderedNames.map(name=>entry(name,"Glossary content")).join("")}</ol></span></div></div>`;
            const definition=fixture.querySelector('#definition'),glossary=fixture.querySelector('#glossary');
            buildToggle({definition,glossary},()=>{},document.createElement('div'))();
            let index=0;
            for(const direction of ['left','right']){
              for(let step=0;step<orderedNames.length+1;step++){
                const active=fixture.querySelector('#definition.show,#glossary.show');
                const dictionary=[...active.querySelectorAll('li[data-dictionary]')].find(li=>getComputedStyle(li).display!=='none')?.dataset.dictionary;
                if(dictionary!==orderedNames[index])throw Error(`${theme}, 概要 ${definitionName}: expected index ${index+1} ${orderedNames[index]}, got ${dictionary}`);
                if(active.querySelector('.dictionary-counter').textContent!==`${index+1} / 11`)throw Error(`${theme}, 概要: dictionary indices changed`);
                if(definitionName!==orderedNames[8]&&active===definition)throw Error(`${theme}, 概要: obsolete Definition inserted into glossary cycle`);
                checks++;
                if(step%2)active.querySelector(`.toggle-area.${direction}`).click();
                else document.dispatchEvent(new KeyboardEvent('keydown',{key:direction==='left'?'j':'k',bubbles:true}));
                index=(index+(direction==='left'?-1:1)+orderedNames.length)%orderedNames.length;
              }
            }
          }
        }
      } finally {
        for (const [key, value] of saved) {
          if (value === null) localStorage.removeItem(key);
          else localStorage.setItem(key, value);
        }
      }
      result.textContent = `PASS: ${checks} dictionary visibility and cycling checks`;
      document.documentElement.dataset.testResult = "pass";
    } catch (error) {
      result.textContent = `FAIL: ${error.message}`;
      document.documentElement.dataset.testResult = "fail";
    }
  })();
</script>

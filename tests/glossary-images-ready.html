<!doctype html>
<meta charset="utf-8">
<title>Glossary images never block review</title>
<output id="result">Running…</output>
<div id="fixture"></div>
<script>
(async () => {
  const originalDecode = HTMLImageElement.prototype.decode;
  try {
    const source = await fetch("../_senren_back_v4.7.0.js").then(r => r.text());
    const start = source.indexOf("  function prepareDictionarySources() {");
    const end = source.indexOf("  function enableInteractions() {", start);
    const build = new Function("ELS", "collapseDictionary", "lightbox", "collectGlossaryImages", "consolidateYomitanGlossaryEntries",
      source.slice(start, end) + "; return {prepareDictionarySources, toggleDefinition};");
    const image = '<img loading="lazy" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2220%22 height=%2220%22/%3E">';
    const assert = (ok, message) => { if (!ok) throw Error(message); };
    let decodeRequests = 0;
    HTMLImageElement.prototype.decode = () => {
      decodeRequests++;
      return new Promise(() => {});
    };
    window.senrenCardController = new AbortController();
    window.onUpdateHook = [];
    fixture.innerHTML = '<div id="dictionaryPreference" hidden>A</div><div id="glossary"><div class="dictionary-counter"></div><div class="toggle-area right"></div><div class="glossary-box"><template class="senren-dictionary-source"><ol><li data-dictionary="A">Text A' + image + '</li><li data-dictionary="B">Text B' + image + '</li></ol></template></div></div>';
    const glossary = fixture.querySelector("#glossary");
    const api = build({glossary}, () => {}, document.createElement("div"), () => {}, () => {});
    api.prepareDictionarySources();
    api.toggleDefinition();
    const first = glossary.querySelector('[data-dictionary="A"]');
    assert(glossary.classList.contains("show") && first.style.display === "block", "Preferred dictionary did not appear immediately");
    assert(first.style.opacity !== "0", "Text was hidden while an image loaded");
    assert(onUpdateHook.length === 0, "Glossary added an answer-reveal wait");
    assert(decodeRequests === 0, "Glossary forced image decoding");
    assert(!glossary.querySelector('[data-dictionary="B"] img'), "Inactive dictionary image was mounted");
    glossary.querySelector(".toggle-area.right").click();
    const second = glossary.querySelector('[data-dictionary="B"]');
    assert(second.style.display === "block" && second.style.opacity !== "0", "Dictionary switching waited for an image");
    assert(first.style.display === "none" && second.textContent.includes("Text B"), "Switching exposed the wrong dictionary");
    assert(onUpdateHook.length === 0 && decodeRequests === 0, "Switching introduced image work on the reveal path");
    result.textContent = "PASS: immediate text reveal and switching with stalled image decoding";
  } catch (error) {
    result.textContent = "FAIL: " + error.stack;
  } finally {
    HTMLImageElement.prototype.decode = originalDecode;
  }
})();
</script>
